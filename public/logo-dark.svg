<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Blue primary gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Electric Indigo accent gradient -->
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Metallic facet highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Deep shadow facet -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E" />
      <stop offset="100%" stop-color="#021C35" />
    </linearGradient>

    <!-- Luminous Glow Filter for Dark Mode -->
    <filter id="darkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Geometric Faceted Logo Emblem -->
  <g transform="translate(6, 6)" filter="url(#darkGlow)">
    <!-- Base dark glow disc -->
    <circle cx="26" cy="26" r="24" fill="#0369A1" fill-opacity="0.2" />

    <!-- Left Wing / Facet (Geometric 3D X Left arm) -->
    <path d="M 12 10 L 26 26 L 19 33 L 5 19 Z" fill="url(#primaryGrad)" />
    
    <!-- Right Wing / Facet (Geometric 3D X Right arm) -->
    <path d="M 40 10 L 26 26 L 33 33 L 47 19 Z" fill="url(#accentGrad)" />

    <!-- Bottom Left Wing (Geometric 3D X Lower Left) -->
    <path d="M 26 26 L 12 42 L 5 33 L 19 19 Z" fill="url(#shadowGrad)" opacity="0.9" />

    <!-- Bottom Right Wing (Geometric 3D X Lower Right) -->
    <path d="M 26 26 L 40 42 L 47 33 L 33 19 Z" fill="url(#primaryGrad)" />

    <!-- Center Faceted Prism Core -->
    <polygon points="26,14 36,26 26,38 16,26" fill="url(#accentGrad)" opacity="0.9" />

    <!-- Highlight Crest -->
    <polygon points="26,14 32,23 26,26 20,23" fill="url(#highlightGrad)" />

    <!-- Inner Core Gleam -->
    <circle cx="26" cy="26" r="2.5" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Brand Typography -->
  <!-- "Strate" in pure white for dark mode -->
  <text x="68" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
    Strate<tspan fill="url(#primaryGrad)" font-weight="900">X</tspan>
  </text>

  <!-- Glowing cyan accent dot -->
  <circle cx="204" cy="35" r="3" fill="#00F2FE" filter="url(#darkGlow)" />

  <!-- Subtitle Tagline for Dark Mode -->
  <text x="70" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="2.8" fill="#38BDF8" opacity="0.9">
    DIGITAL SOLUTIONS
  </text>
</svg>
